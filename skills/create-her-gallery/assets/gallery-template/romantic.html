<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Her Gallery</title>
  <style>
    :root {
      --moon: #f8f5ec;
      --moon-soft: rgba(248, 245, 236, .78);
      --pine: #24342f;
      --pine-soft: #53645e;
      --honey: #d2a45f;
      --rose: #d9aaa9;
      --sage: #a5b5a2;
      --glass-line: rgba(255, 255, 255, .54);
      --shadow: rgba(25, 43, 35, .24);
      --display: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--pine);
      background: #34493d;
      font-family: var(--body);
    }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 2px solid var(--honey); outline-offset: 4px; }
    .background {
      position: fixed;
      inset: -2%;
      z-index: 0;
      overflow: hidden;
      background: #34493d;
      filter: brightness(.92) saturate(.94);
      transform: scale(1.03);
      animation: background-breathe 24s ease-in-out infinite alternate;
    }
    .background-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }
    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 74% 22%, rgba(255, 244, 213, .18), transparent 30%),
        linear-gradient(115deg, rgba(31, 53, 43, .20), rgba(255, 244, 232, .06) 48%, rgba(120, 75, 76, .12));
    }
    .topbar {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      z-index: 20;
      width: min(92vw, 680px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 10px 14px;
      transform: translateX(-50%);
      color: var(--pine);
      background: rgba(250, 247, 239, .70);
      border: 1px solid var(--glass-line);
      border-radius: 999px;
      box-shadow: 0 12px 38px rgba(34, 52, 45, .14);
      backdrop-filter: blur(18px) saturate(1.1);
      transition: opacity .4s ease, transform .4s ease;
    }
    .topbar[data-visible="false"] { opacity: 0; pointer-events: none; transform: translate(-50%, -12px); }
    .chapter-label { overflow: hidden; font: 600 .76rem/1.3 var(--display); letter-spacing: .1em; text-overflow: ellipsis; white-space: nowrap; }
    .progress-dots { display: flex; align-items: center; justify-content: center; gap: 9px; }
    .progress-dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(36, 52, 47, .24);
      cursor: pointer;
      transition: width .35s ease, border-radius .35s ease, background .35s ease, box-shadow .35s ease;
    }
    .progress-dot.active { width: 26px; border-radius: 8px; background: var(--honey); box-shadow: 0 0 0 4px rgba(210, 164, 95, .14); }
    .music-button {
      justify-self: end;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 3px 7px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: .72rem;
    }
    .music-button[data-ready="true"] { display: flex; }
    .music-mark { width: 7px; height: 7px; border-radius: 50%; background: var(--rose); }
    .music-button[data-playing="true"] .music-mark { animation: music-pulse 1.8s infinite; }
    .pages { position: relative; z-index: 2; width: 100%; height: 100%; }
    .page {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(76px, 11vh, 108px) clamp(18px, 4vw, 54px) clamp(24px, 5vh, 48px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(210,164,95,.42) transparent;
    }
    .page[hidden] { display: none; }
    .letter-card {
      position: relative;
      width: min(92vw, 850px);
      max-height: 82svh;
      padding: clamp(28px, 5vw, 58px);
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, .80), rgba(248, 245, 236, .64));
      border: 1px solid rgba(255, 255, 255, .70);
      border-radius: 28px 28px 72px 28px;
      box-shadow: 0 28px 90px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .74);
      backdrop-filter: blur(22px) saturate(1.08);
      animation: card-arrive .75s cubic-bezier(.22, .72, .2, 1) both;
    }
    .letter-card::-webkit-scrollbar { display: none; }
    .letter-card::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, rgba(255,255,255,.12) 48%, rgba(210,164,95,.20) 50%, rgba(255,255,255,.5));
      border-radius: 18px 0 0 0;
      pointer-events: none;
    }
    .folio { margin: 0 0 18px; color: #8b6b3d; font: .7rem/1.3 var(--body); letter-spacing: .24em; text-transform: uppercase; }
    h1, h2 { margin: 0; font-family: var(--display); font-weight: 600; text-wrap: balance; }
    h1 { font-size: clamp(2.4rem, 6.2vw, 5rem); letter-spacing: .04em; }
    .intro-subtitle { max-width: 35rem; margin: 18px auto 0; color: var(--pine-soft); font-size: clamp(.96rem, 1.7vw, 1.12rem); letter-spacing: .08em; }
    .preface-lines { display: grid; gap: .35rem; font: clamp(1.05rem, 2vw, 1.35rem)/1.75 var(--display); }
    .preface-line {
      opacity: 0;
      transform: translateY(12px);
      filter: blur(7px);
      animation: line-arrive 1.55s cubic-bezier(.22,.68,.2,1) forwards;
      will-change: opacity, transform, filter;
    }
    #loading .preface-line { animation-duration: .9s; }
    .primary-button {
      min-height: 44px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform .22s ease, background .22s ease, box-shadow .22s ease;
    }
    .primary-button {
      margin-top: 28px;
      padding: 10px 24px;
      color: #fffdf8;
      background: linear-gradient(135deg, #bd8c4a, #d7ac6c);
      border: 1px solid rgba(255,255,255,.32);
      box-shadow: 0 10px 28px rgba(139, 101, 51, .22);
    }
    .primary-button:hover { transform: translateY(-2px); }
    .story-stage {
      position: relative;
      width: min(94vw, 1120px);
      height: min(78svh, 720px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 0fr;
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
      overflow: hidden;
      background: rgba(255,255,255,.46);
      border: 1px solid rgba(255,255,255,.66);
      border-radius: 30px 30px 88px 30px;
      box-shadow: 0 28px 90px rgba(31,48,41,.13), inset 0 1px 0 rgba(255,255,255,.64);
      backdrop-filter: none;
      transition: grid-template-columns 1s cubic-bezier(.2,.76,.22,1), gap 1s cubic-bezier(.2,.76,.22,1);
    }
    .page-turn {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 82px;
      height: 82px;
      z-index: 5;
      padding: 0;
      opacity: .28;
      pointer-events: none;
      cursor: pointer;
      border: 0;
      border-radius: 22px 0 0 0;
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
      background: linear-gradient(135deg, transparent 46%, rgba(210,164,95,.24) 48%, rgba(255,255,255,.68) 70%);
      box-shadow: inset -8px -8px 24px rgba(173,126,65,.16);
      transition: opacity .5s ease, filter .5s ease;
    }
    .page-turn::after {
      content: "";
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 9px;
      height: 9px;
      border-right: 1px solid rgba(118,81,39,.72);
      border-bottom: 1px solid rgba(118,81,39,.72);
      transform: rotate(-45deg);
    }
    .chapter-page[data-complete="true"] .page-turn {
      opacity: 1;
      pointer-events: auto;
      animation: fold-glow 3.2s ease-in-out infinite;
    }
    .chapter-page[data-phase="text"] .story-stage { cursor: pointer; }
    .chapter-page[data-phase="media"] .story-stage { grid-template-columns: minmax(260px, .78fr) minmax(0, 1.42fr); gap: clamp(18px, 3vw, 38px); }
    .poem-panel {
      position: relative;
      z-index: 2;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(30px, 6vw, 72px);
      text-align: center;
      transition: align-items .8s ease, padding 1s ease, text-align .8s ease;
    }
    .chapter-page[data-phase="media"] .poem-panel { align-items: flex-start; padding: clamp(28px, 4vw, 52px) 0 clamp(28px, 4vw, 52px) clamp(28px, 4vw, 52px); text-align: left; }
    .chapter-kicker { margin: 0 0 12px; color: #8d6a3d; font-size: .72rem; letter-spacing: .18em; }
    .chapter-title { max-width: 680px; font-size: clamp(1.9rem, 3.6vw, 3rem); font-weight: 500; line-height: 1.22; transition: font-size .8s ease; }
    .chapter-page[data-phase="media"] .chapter-title { font-size: clamp(1.55rem, 2.4vw, 2.2rem); }
    .gold-thread {
      width: min(220px, 48%);
      height: 1px;
      margin: 22px 0;
      background: linear-gradient(90deg, transparent, var(--honey), transparent);
      transform-origin: center;
      animation: thread-write 1.2s ease both;
    }
    .chapter-page[data-phase="media"] .gold-thread { width: 72px; background: linear-gradient(90deg, var(--honey), transparent); transform-origin: left; }
    .poem-lines { display: grid; gap: .38rem; max-width: 620px; color: #445750; font: clamp(1.12rem, 2vw, 1.35rem)/1.68 var(--display); }
    .poem-line { opacity: 0; transform: translateY(10px); filter: blur(5px); transition: opacity .8s ease, transform .8s ease, filter .8s ease; }
    .poem-line.visible { opacity: 1; transform: translateY(0); filter: blur(0); }
    .media-panel {
      min-width: 0;
      min-height: 0;
      height: 100%;
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: clamp(18px, 3vw, 34px) clamp(18px, 3vw, 34px) clamp(18px, 3vw, 34px) 0;
      opacity: 0;
      transform: translateX(40px);
      pointer-events: none;
      transition: opacity .8s ease .24s, transform .9s cubic-bezier(.2,.76,.22,1) .18s;
    }
    .chapter-page[data-phase="media"] .media-panel { opacity: 1; transform: translateX(0); pointer-events: auto; }
    .media-frame {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-radius: 22px;
      box-shadow: none;
      cursor: pointer;
    }
    .media-viewport {
      position: relative;
      height: 100%;
      width: auto;
      max-width: 100%;
      flex: 0 1 auto;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(39,54,48,.12);
      box-shadow: 0 20px 48px rgba(30,48,39,.18), 0 0 0 1px rgba(255,255,255,.46);
    }
    .media-backdrop {
      position: absolute;
      inset: -7%;
      z-index: 1;
      width: 114%;
      height: 114%;
      object-fit: cover;
      filter: blur(22px) saturate(.88) brightness(.72);
      transform: scale(1.08);
      opacity: 0;
      transition: opacity .7s ease;
    }
    .chapter-video, .chapter-image {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      margin: auto;
      display: block;
      object-fit: contain;
      object-position: center;
      background: transparent;
      opacity: 0;
      scale: var(--media-crop-scale, 1);
      transform: translateY(var(--media-crop-y, 0%)) scale(1.025);
      transform-origin: center;
      transition: opacity .55s ease, transform 1.2s ease;
    }
    .chapter-video.visible, .chapter-image.visible { opacity: 1; transform: translateY(var(--media-crop-y, 0%)) scale(1); }
    .media-backdrop.visible { opacity: .58; }
    .chapter-image[data-motion="slow-zoom"] { animation: media-zoom 12s ease-in-out infinite alternate; }
    .chapter-image[data-motion="drift-left"] { animation: media-drift-left 14s ease-in-out infinite alternate; }
    .chapter-image[data-motion="drift-right"] { animation: media-drift-right 14s ease-in-out infinite alternate; }
    .chapter-image[data-motion="breathe"] { animation: media-breathe 9s ease-in-out infinite; }
    .media-viewport [hidden] { display: none !important; }
    .media-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; padding: 9px 6px 0; color: var(--pine-soft); font-size: .72rem; letter-spacing: .06em; }
    .media-caption { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .media-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }
    .media-count { color: #8d6a3d; }
    .replay-button {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      padding: 0;
      color: rgba(60,75,68,.74);
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: opacity .5s ease, transform 1.2s cubic-bezier(.2,.76,.22,1), background .3s ease;
    }
    .replay-button svg { width: 16px; height: 16px; }
    .chapter-page[data-complete="true"] .replay-button { opacity: 1; pointer-events: auto; }
    .replay-button:hover { transform: rotate(-360deg); background: rgba(255,255,255,.46); }
    .end-copy { white-space: pre-line; color: var(--pine-soft); font: clamp(1.05rem, 2vw, 1.32rem)/1.9 var(--display); }
    .music-credit { margin: 22px auto 0; color: rgba(68,87,80,.78); font-size: .7rem; line-height: 1.6; letter-spacing: .04em; }
    .music-credit a { color: inherit; text-underline-offset: 3px; }
    .memory-sparkles {
      position: fixed;
      left: var(--sparkle-x);
      top: var(--sparkle-y);
      z-index: 9999;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .memory-star {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--star-size);
      height: var(--star-size);
      background: var(--star-color);
      clip-path: polygon(50% 0,61% 36%,100% 50%,61% 64%,50% 100%,39% 64%,0 50%,39% 36%);
      filter: drop-shadow(0 0 5px var(--star-glow));
      opacity: 0;
      transform: translate(-50%,-50%) rotate(var(--star-rotate)) scale(.2);
      animation: star-drift var(--star-life) cubic-bezier(.18,.72,.24,1) var(--star-delay) forwards;
    }
    @keyframes background-breathe { to { transform: scale(1.075) translate3d(-.5%, .5%, 0); } }
    @keyframes card-arrive { from { opacity: 0; transform: translateY(14px) scale(.985); } }
    @keyframes line-arrive {
      0% { opacity: 0; transform: translateY(12px); filter: blur(7px); }
      42% { opacity: .46; filter: blur(3px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes thread-write { from { transform: scaleX(0); opacity: 0; } }
    @keyframes music-pulse { 70% { box-shadow: 0 0 0 8px rgba(217,170,169,0); } 100% { box-shadow: 0 0 0 0 rgba(217,170,169,0); } }
    @keyframes media-zoom { to { transform: translateY(var(--media-crop-y, 0%)) scale(1.07); } }
    @keyframes media-drift-left { to { transform: translate(-4%, var(--media-crop-y, 0%)) scale(1.04); } }
    @keyframes media-drift-right { from { transform: translate(-4%, var(--media-crop-y, 0%)) scale(1.04); } to { transform: translate(0, var(--media-crop-y, 0%)) scale(1.04); } }
    @keyframes media-breathe { 50% { transform: translateY(var(--media-crop-y, 0%)) scale(1.04); } }
    @keyframes fold-glow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(218,173,105,0)); }
      50% { filter: drop-shadow(-6px -6px 11px rgba(255,221,158,.62)); }
    }
    @keyframes star-drift {
      0% { opacity: 0; transform: translate(-50%,-50%) rotate(var(--star-rotate)) scale(.2); }
      16% { opacity: .96; transform: translate(-50%,-50%) rotate(var(--star-rotate)) scale(1); }
      58% { opacity: .78; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--star-x)), calc(-50% + var(--star-y))) rotate(var(--star-turn)) scale(.55); }
    }
    @media (max-width: 960px) {
      .page { padding: 72px 10px max(12px, env(safe-area-inset-bottom)); }
      .chapter-page { display: block; overflow-y: auto; }
      .topbar { top: max(10px, env(safe-area-inset-top)); width: calc(100vw - 20px); grid-template-columns: minmax(0,1fr) auto auto; gap: 9px; padding: 8px 11px; }
      .music-text { display: none; }
      .story-stage { width: calc(100vw - 20px); height: calc(100svh - 88px); margin: 0 auto; border-radius: 22px 22px 48px 22px; }
      .chapter-page[data-phase="media"] .story-stage { height: auto; min-height: calc(100svh - 88px); grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; gap: 0; transition: none; }
      .poem-panel, .chapter-page[data-phase="media"] .poem-panel { align-items: center; justify-content: center; padding: 22px 22px 12px; text-align: center; }
      .chapter-page[data-phase="media"] .poem-panel { grid-column: 1; grid-row: 1; width: 100%; height: auto; min-height: 0; justify-content: flex-start; padding-top: 32px; }
      .chapter-title, .chapter-page[data-phase="media"] .chapter-title { font-size: clamp(1.5rem, 5.5vw, 1.95rem); }
      .chapter-page[data-phase="media"] .gold-thread { width: 62px; transform-origin: center; background: linear-gradient(90deg, transparent, var(--honey), transparent); }
      .gold-thread { margin: 12px 0; }
      .poem-lines { gap: .18rem; font-size: clamp(1.02rem, 4.15vw, 1.16rem); line-height: 1.56; }
      .media-panel { padding: 6px 14px 14px; transform: translateY(30px); }
      .chapter-page[data-phase="media"] .media-panel { grid-column: 1; grid-row: 2; justify-self: stretch; width: 100%; max-width: none; height: auto; min-height: min(58svh, 520px); padding: 6px 14px 14px; transform: translateY(0); }
      .chapter-page[data-phase="media"] .media-frame { width: 100%; height: min(56svh, 500px); justify-content: center; }
      .chapter-page[data-phase="media"] .media-viewport { width: min(100%, 334px); height: auto; max-height: min(56svh, 500px); margin-inline: auto; }
      .media-frame { border-radius: 17px; }
      .media-meta { min-height: 34px; padding-top: 5px; }
      .page-turn { width: 70px; height: 70px; }
      .letter-card { width: calc(100vw - 28px); border-radius: 24px 24px 54px 24px; }
    }
    @media (orientation: portrait) {
      .chapter-page[data-phase="media"] .story-stage {
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        width: calc(100vw - 20px);
        height: auto;
        min-height: calc(100svh - 88px);
        margin-inline: auto;
        gap: 0;
      }
      .chapter-page[data-phase="media"] .poem-panel {
        flex: 0 0 auto;
        width: 100%;
      }
      .chapter-page[data-phase="media"] .media-panel {
        flex: 0 0 auto;
        align-self: stretch;
        width: 100%;
        max-width: 100%;
        padding: 6px 14px 14px;
      }
      .chapter-page[data-phase="media"] .media-frame {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .chapter-page[data-phase="media"] .media-viewport {
        flex: 0 0 auto;
        width: min(334px, calc(100vw - 48px));
        height: auto;
        margin: 0 auto;
        aspect-ratio: 2 / 3;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
      .preface-line, .poem-line { opacity: 1; transform: none; filter: none; }
      .memory-sparkles { display: none; }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"><img class="background-image" id="backgroundImage" alt=""></div>
  <header class="topbar" id="topbar" data-visible="false">
    <div class="chapter-label" id="chapterLabel"></div>
    <nav class="progress-dots" id="progressDots" aria-label="章节导航"></nav>
    <button class="music-button" id="musicButton" type="button" data-ready="false" data-playing="false" aria-label="播放背景音乐">
      <span class="music-mark" aria-hidden="true"></span><span class="music-text">音乐</span>
    </button>
  </header>
  <main class="pages" id="pages"></main>
  <audio id="bgm" loop preload="metadata"></audio>
  <script id="gallery-data" type="application/json">__GALLERY_DATA__</script>
  <script>
    (() => {
      const rawGalleryData = document.getElementById('gallery-data').textContent.trim();
      if (!rawGalleryData.startsWith('{')) {
        document.getElementById('pages').innerHTML = `
          <section class="page" style="display:flex">
            <div class="letter-card">
              <p class="folio">Her Gallery · Template</p>
              <h1 style="font-size:clamp(2rem,6vw,4rem)">这里是生成模板</h1>
              <p class="intro-subtitle">这是生成模板。请先完成访谈与素材选择，再使用生成脚本制作属于她的诗相册。</p>
            </div>
          </section>`;
        return;
      }
      const data = JSON.parse(rawGalleryData);
      const labels = { loading:'正在打开这封信...', enterHome:'继续', start:'打开这份礼物', finish:'读到这里', restart:'重新读一遍', ...(data.labels || {}) };
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.title = `${data.title}——致${data.displayName}`;
      if (data.background) document.getElementById('backgroundImage').src = data.background;

      const pages = document.getElementById('pages');
      const topbar = document.getElementById('topbar');
      const chapterLabel = document.getElementById('chapterLabel');
      const progressDots = document.getElementById('progressDots');
      const bgm = document.getElementById('bgm');
      const musicButton = document.getElementById('musicButton');
      let runId = 0;
      let introTimer;

      document.addEventListener('pointerdown', event => {
        if (reduceMotion || event.button !== 0 || event.isPrimary === false) return;
        const sparkle = document.createElement('span');
        sparkle.className = 'memory-sparkles';
        sparkle.setAttribute('aria-hidden', 'true');
        sparkle.style.setProperty('--sparkle-x', `${event.clientX}px`);
        sparkle.style.setProperty('--sparkle-y', `${event.clientY}px`);
        const stars = [
          { x:-33, y:-24, size:11, delay:0,    life:1.05, color:'#b77927', glow:'#e3a950', rotate:-12, turn:54 },
          { x:  5, y:-38, size: 8, delay:.05,  life:1.18, color:'#f1c56f', glow:'#ffe5a7', rotate:18,  turn:92 },
          { x: 34, y:-17, size:12, delay:.1,   life:.96, color:'#d3983e', glow:'#f3c468', rotate:38,  turn:108 },
          { x: 39, y: 17, size: 7, delay:.16,  life:1.22, color:'#ffe1a0', glow:'#fff0c8', rotate:5,   turn:82 },
          { x: 14, y: 34, size:10, delay:.22,  life:1.08, color:'#a96e24', glow:'#dc9c42', rotate:24,  turn:116 },
          { x:-18, y: 31, size: 6, delay:.28,  life:1.24, color:'#edbd62', glow:'#ffdda0', rotate:44,  turn:128 },
          { x:-41, y: 10, size: 9, delay:.34,  life:1.02, color:'#c48731', glow:'#eeb55c', rotate:10,  turn:74 },
          { x: -9, y: -8, size: 5, delay:.4,   life:.9,  color:'#fff0bf', glow:'#fff5dc', rotate:30,  turn:96 }
        ];
        stars.forEach(item => {
          const star = document.createElement('i');
          star.className = 'memory-star';
          star.style.setProperty('--star-x', `${item.x}px`);
          star.style.setProperty('--star-y', `${item.y}px`);
          star.style.setProperty('--star-size', `${item.size}px`);
          star.style.setProperty('--star-delay', `${item.delay}s`);
          star.style.setProperty('--star-life', `${item.life}s`);
          star.style.setProperty('--star-color', item.color);
          star.style.setProperty('--star-glow', item.glow);
          star.style.setProperty('--star-rotate', `${item.rotate}deg`);
          star.style.setProperty('--star-turn', `${item.turn}deg`);
          sparkle.appendChild(star);
        });
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1800);
      }, { passive: true });

      const wait = ms => new Promise(resolve => setTimeout(resolve, reduceMotion ? 20 : ms));
      const page = (id, className='') => {
        const section = document.createElement('section');
        section.id = id;
        section.className = `page ${className}`.trim();
        section.hidden = true;
        return section;
      };
      const actionButton = (text, target, className='primary-button') => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = className;
        button.textContent = text;
        button.dataset.target = target;
        return button;
      };

      const loading = page('loading');
      const loadingCard = document.createElement('div');
      loadingCard.className = 'letter-card';
      loadingCard.innerHTML = `<p class="folio">Her Gallery</p><div class="preface-lines"><span class="preface-line" style="animation-delay:.15s">${labels.loading}</span></div>`;
      loading.appendChild(loadingCard);
      pages.appendChild(loading);

      const preface = page('preface');
      const prefaceCard = document.createElement('div');
      prefaceCard.className = 'letter-card';
      const prefaceFolio = document.createElement('p');
      prefaceFolio.className = 'folio';
      prefaceFolio.textContent = '写在前面';
      const prefaceLines = document.createElement('div');
      prefaceLines.className = 'preface-lines';
      data.preface.split('\n').forEach((line,index) => {
        const span = document.createElement('span');
        span.className = 'preface-line';
        span.style.animationDelay = `${.45 + index * .38}s`;
        span.textContent = line;
        prefaceLines.appendChild(span);
      });
      prefaceCard.append(prefaceFolio, prefaceLines, actionButton(labels.enterHome, 'home'));
      preface.appendChild(prefaceCard);
      pages.appendChild(preface);

      const home = page('home');
      const homeCard = document.createElement('div');
      homeCard.className = 'letter-card';
      const homeFolio = document.createElement('p');
      homeFolio.className = 'folio';
      homeFolio.textContent = `一份写给 ${data.displayName} 的私人展览`;
      const title = document.createElement('h1');
      title.textContent = data.title;
      const subtitle = document.createElement('p');
      subtitle.className = 'intro-subtitle';
      subtitle.textContent = data.subtitle || '';
      const startButton = actionButton(labels.start, 'chapter1');
      startButton.dataset.startMusic = 'true';
      homeCard.append(homeFolio, title, subtitle, startButton);
      home.appendChild(homeCard);
      pages.appendChild(home);

      data.chapters.forEach((chapter,index) => {
        const id = `chapter${index + 1}`;
        const dot = document.createElement('button');
        dot.className = 'progress-dot';
        dot.type = 'button';
        dot.dataset.target = id;
        dot.setAttribute('aria-label', `前往第 ${index + 1} 章：${chapter.title}`);
        progressDots.appendChild(dot);

        const section = page(id, 'chapter-page');
        section.dataset.phase = 'text';
        section.dataset.complete = 'false';
        section.dataset.skipReveal = String(index);
        const stage = document.createElement('div');
        stage.className = 'story-stage';
        const poem = document.createElement('article');
        poem.className = 'poem-panel';
        const kicker = document.createElement('p');
        kicker.className = 'chapter-kicker';
        kicker.textContent = chapter.kicker || `第 ${index + 1} 章`;
        const heading = document.createElement('h2');
        heading.className = 'chapter-title';
        heading.textContent = chapter.title;
        const thread = document.createElement('div');
        thread.className = 'gold-thread';
        thread.setAttribute('aria-hidden','true');
        const lines = document.createElement('div');
        lines.className = 'poem-lines';
        chapter.text.split('\n').forEach(line => {
          const span = document.createElement('span');
          span.className = 'poem-line';
          span.textContent = line;
          lines.appendChild(span);
        });
        poem.append(kicker, heading, thread, lines);

        const mediaPanel = document.createElement('div');
        mediaPanel.className = 'media-panel';
        const frame = document.createElement('div');
        frame.className = 'media-frame';
        frame.setAttribute('role','button');
        frame.setAttribute('tabindex','0');
        frame.setAttribute('aria-label','暂停或继续播放影像');
        const viewport = document.createElement('div');
        viewport.className = 'media-viewport';
        const videoBackdrop = document.createElement('video');
        videoBackdrop.className = 'media-backdrop video-backdrop';
        videoBackdrop.muted = true;
        videoBackdrop.playsInline = true;
        videoBackdrop.preload = 'metadata';
        videoBackdrop.setAttribute('aria-hidden', 'true');
        const video = document.createElement('video');
        video.className = 'chapter-video';
        video.muted = true;
        video.playsInline = true;
        video.preload = 'metadata';
        const imageBackdrop = document.createElement('img');
        imageBackdrop.className = 'media-backdrop image-backdrop';
        imageBackdrop.alt = '';
        imageBackdrop.setAttribute('aria-hidden', 'true');
        imageBackdrop.hidden = true;
        const image = document.createElement('img');
        image.className = 'chapter-image';
        image.hidden = true;
        viewport.append(videoBackdrop, imageBackdrop, video, image);
        frame.appendChild(viewport);
        const meta = document.createElement('div');
        meta.className = 'media-meta';
        const caption = document.createElement('span');
        caption.className = 'media-caption';
        const tools = document.createElement('span');
        tools.className = 'media-tools';
        const replay = document.createElement('button');
        replay.type = 'button';
        replay.className = 'replay-button';
        replay.dataset.replay = String(index);
        replay.setAttribute('aria-label', '重看这一章');
        replay.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const count = document.createElement('span');
        count.className = 'media-count';
        tools.append(replay, count);
        meta.append(caption, tools);
        mediaPanel.append(frame, meta);

        const nextTarget = index === data.chapters.length - 1 ? 'end' : `chapter${index + 2}`;
        const pageTurn = document.createElement('button');
        pageTurn.type = 'button';
        pageTurn.className = 'page-turn';
        pageTurn.dataset.target = nextTarget;
        pageTurn.setAttribute('aria-label', index === data.chapters.length - 1 ? labels.finish : '下一章');
        stage.append(poem, mediaPanel, pageTurn);
        section.appendChild(stage);
        pages.appendChild(section);
      });

      const end = page('end');
      const endCard = document.createElement('div');
      endCard.className = 'letter-card';
      const endFolio = document.createElement('p');
      endFolio.className = 'folio';
      endFolio.textContent = '写在最后';
      const endCopy = document.createElement('div');
      endCopy.className = 'end-copy';
      endCopy.textContent = data.dedication;
      const musicCredit = document.createElement('p');
      musicCredit.className = 'music-credit';
      let hasCredits = false;
      const appendCredit = (label, credit) => {
        if (!credit?.attribution) return;
        if (hasCredits) musicCredit.append(document.createElement('br'));
        musicCredit.append(document.createTextNode(`${label}：${credit.attribution}`));
        if (credit.sourceUrl) {
          const sourceLink = document.createElement('a');
          sourceLink.href = credit.sourceUrl;
          sourceLink.target = '_blank';
          sourceLink.rel = 'noopener noreferrer';
          sourceLink.textContent = '查看来源';
          musicCredit.append(document.createTextNode(' · '), sourceLink);
        }
        hasCredits = true;
      };
      appendCredit('音乐', data.music);
      appendCredit('背景', data.backgroundMeta);
      musicCredit.hidden = !hasCredits;
      endCard.append(endFolio, endCopy, musicCredit, actionButton(labels.restart, 'home'));
      end.appendChild(endCard);
      pages.appendChild(end);

      const imageTypes = ['data:image/jpeg', 'data:image/png', 'data:image/gif', 'data:image/webp', 'data:image/avif'];
      const isImage = src => imageTypes.some(type => src.startsWith(type)) || /\.(jpe?g|png|gif|webp|avif)(?:$|[?#])/i.test(src);
      const pauseAllVideos = () => document.querySelectorAll('video').forEach(video => video.pause());
      const setNavigation = id => {
        const match = id.match(/^chapter(\d+)$/);
        const chapterIndex = match ? Number(match[1]) - 1 : -1;
        topbar.dataset.visible = chapterIndex >= 0 || id === 'end' ? 'true' : 'false';
        chapterLabel.textContent = chapterIndex >= 0 ? data.chapters[chapterIndex].title : id === 'end' ? '写在最后' : '';
        progressDots.querySelectorAll('.progress-dot').forEach((dot,index) => dot.classList.toggle('active', index === chapterIndex));
      };
      const showPage = id => {
        runId += 1;
        pauseAllVideos();
        pages.querySelectorAll('.page').forEach(item => item.hidden = true);
        const target = document.getElementById(id);
        if (!target) return;
        target.hidden = false;
        target.scrollTop = 0;
        setNavigation(id);
        const match = id.match(/^chapter(\d+)$/);
        if (match) beginChapter(Number(match[1]) - 1, runId);
      };

      const beginChapter = async (index, token) => {
        const section = document.getElementById(`chapter${index + 1}`);
        section.dataset.phase = 'text';
        section.dataset.complete = 'false';
        const lines = [...section.querySelectorAll('.poem-line')];
        lines.forEach(line => line.classList.remove('visible'));
        section.dataset.mediaPaused = 'false';
        section.querySelectorAll('.chapter-video, .chapter-image, .media-backdrop').forEach(item => item.classList.remove('visible'));
        await wait(500);
        for (const line of lines) {
          if (token !== runId) return;
          line.classList.add('visible');
          await wait(1050 + Math.min(line.textContent.length * 16, 260));
        }
        if (token !== runId) return;
        await wait(750);
        enterMedia(index, token);
      };

      const enterMedia = async (index, token) => {
        if (token !== runId) return;
        const section = document.getElementById(`chapter${index + 1}`);
        section.querySelectorAll('.poem-line').forEach(line => line.classList.add('visible'));
        section.dataset.phase = 'media';
        await wait(950);
        if (token !== runId) return;
        playMedia(index, 0, token);
      };

      const playMedia = async (chapterIndex, mediaIndex, token) => {
        if (token !== runId) return;
        const section = document.getElementById(`chapter${chapterIndex + 1}`);
        const media = data.chapters[chapterIndex].media || [];
        if (!media.length || mediaIndex >= media.length) {
          section.dataset.complete = 'true';
          return;
        }
        const item = media[mediaIndex];
        const video = section.querySelector('.chapter-video');
        const videoBackdrop = section.querySelector('.video-backdrop');
        const image = section.querySelector('.chapter-image');
        const imageBackdrop = section.querySelector('.image-backdrop');
        section.dataset.mediaPaused = 'false';
        [video, videoBackdrop, image, imageBackdrop].forEach(element => element.classList.remove('visible'));
        video.pause();
        videoBackdrop.pause();
        await wait(mediaIndex ? 420 : 120);
        if (token !== runId) return;
        section.querySelector('.media-caption').textContent = item.caption || '';
        section.querySelector('.media-count').textContent = `${mediaIndex + 1} / ${media.length}`;
        const cropScale = String(item.cropScale || 1);
        const cropY = item.cropY || '0%';
        if (isImage(item.src)) {
          video.hidden = true;
          videoBackdrop.hidden = true;
          image.hidden = false;
          imageBackdrop.hidden = false;
          image.src = item.src;
          image.alt = item.alt ?? '';
          image.dataset.motion = reduceMotion ? 'none' : (item.motion || 'slow-zoom');
          image.style.animationPlayState = 'running';
          image.style.setProperty('--media-crop-scale', cropScale);
          image.style.setProperty('--media-crop-y', cropY);
          imageBackdrop.src = item.src;
          await image.decode().catch(() => {});
          if (token !== runId) return;
          image.classList.add('visible');
          imageBackdrop.classList.add('visible');
          const duration = Math.max(2, Math.min(30, Number(item.duration) || 6.5)) * 1000;
          let elapsed = 0;
          let previous = performance.now();
          while (elapsed < duration && token === runId) {
            await wait(100);
            const now = performance.now();
            if (section.dataset.mediaPaused !== 'true') elapsed += now - previous;
            previous = now;
          }
          if (token === runId) playMedia(chapterIndex, mediaIndex + 1, token);
          return;
        }
        image.hidden = true;
        imageBackdrop.hidden = true;
        video.hidden = false;
        videoBackdrop.hidden = false;
        video.src = item.src;
        videoBackdrop.src = item.src;
        video.style.setProperty('--media-crop-scale', cropScale);
        video.style.setProperty('--media-crop-y', cropY);
        video.setAttribute('aria-label', item.alt || item.caption || `第 ${mediaIndex + 1} 段影像`);
        video.load();
        videoBackdrop.load();
        video.onended = () => playMedia(chapterIndex, mediaIndex + 1, token);
        video.onerror = () => playMedia(chapterIndex, mediaIndex + 1, token);
        try {
          await video.play();
          videoBackdrop.currentTime = video.currentTime;
          videoBackdrop.play().catch(() => {});
          video.classList.add('visible');
          videoBackdrop.classList.add('visible');
        } catch {
          video.classList.add('visible');
          videoBackdrop.classList.add('visible');
          section.dataset.complete = 'true';
        }
      };

      const startMusic = async () => {
        if (!data.music?.src || !bgm.paused) return;
        try { await bgm.play(); musicButton.dataset.playing = 'true'; musicButton.setAttribute('aria-label','暂停背景音乐'); } catch {}
      };
      if (data.music?.src) {
        bgm.src = data.music.src;
        bgm.volume = .42;
        musicButton.dataset.ready = 'true';
        musicButton.addEventListener('click', async () => {
          if (bgm.paused) await startMusic();
          else { bgm.pause(); musicButton.dataset.playing = 'false'; musicButton.setAttribute('aria-label','播放背景音乐'); }
        });
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-target]');
        if (target) {
          clearTimeout(introTimer);
          if (target.dataset.startMusic === 'true') startMusic();
          showPage(target.dataset.target);
          return;
        }
        const skip = event.target.closest('.chapter-page[data-phase="text"][data-skip-reveal]');
        if (skip) {
          const index = Number(skip.dataset.skipReveal);
          const token = ++runId;
          enterMedia(index, token);
          return;
        }
        const replay = event.target.closest('[data-replay]');
        if (replay) {
          const index = Number(replay.dataset.replay);
          const token = ++runId;
          const section = document.getElementById(`chapter${index + 1}`);
          section.dataset.complete = 'false';
          playMedia(index, 0, token);
          return;
        }
        const frame = event.target.closest('.media-frame');
        if (frame) {
          const video = frame.querySelector('.chapter-video');
          const videoBackdrop = frame.querySelector('.video-backdrop');
          if (video.hidden) {
            const section = frame.closest('.chapter-page');
            const paused = section.dataset.mediaPaused === 'true';
            section.dataset.mediaPaused = String(!paused);
            frame.querySelector('.chapter-image').style.animationPlayState = paused ? 'running' : 'paused';
            return;
          }
          if (video.paused) {
            video.play().catch(() => {});
            videoBackdrop.currentTime = video.currentTime;
            videoBackdrop.play().catch(() => {});
          } else {
            video.pause();
            videoBackdrop.pause();
          }
        }
      });
      document.addEventListener('keydown', event => {
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.media-frame')) {
          event.preventDefault();
          event.target.click();
        }
      });

      showPage('loading');
      introTimer = setTimeout(() => showPage('preface'), 1700);
    })();
  </script>
</body>
</html>
