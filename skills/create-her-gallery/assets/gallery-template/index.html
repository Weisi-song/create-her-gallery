<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Her Gallery</title>
  <style>
    :root {
      --paper: #10152e;
      --paper-soft: #18203d;
      --ink: #f4f1ff;
      --muted: #b9bed8;
      --accent: #d7b4ff;
      --accent-2: #83d6e8;
      --line: rgba(215, 180, 255, .34);
      --veil: rgba(8, 11, 26, .76);
      --shadow: rgba(2, 3, 10, .42);
      --display: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --utility: ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    [data-theme="summer-film"] {
      --paper: #1769aa;
      --paper-soft: #f4c842;
      --ink: #172846;
      --muted: #38526f;
      --accent: #e84d36;
      --accent-2: #fff1a8;
      --line: rgba(23, 40, 70, .28);
      --veil: rgba(255, 235, 139, .82);
      --shadow: rgba(24, 47, 72, .28);
      --display: "FZKai-Z03", "KaiTi", "STKaiti", serif;
    }
    [data-theme="forest-specimen"] {
      --paper: #18382e;
      --paper-soft: #294c3c;
      --ink: #f2f2e7;
      --muted: #c0cab8;
      --accent: #c7a2ca;
      --accent-2: #a8d4b2;
      --line: rgba(199, 162, 202, .32);
      --veil: rgba(16, 43, 34, .82);
      --shadow: rgba(4, 18, 13, .42);
    }
    [data-theme="cosmic-stage"] {
      --paper: #07081a;
      --paper-soft: #12152f;
      --ink: #f7f5ff;
      --muted: #b7b9d9;
      --accent: #a970ff;
      --accent-2: #7be4ff;
      --line: rgba(123, 228, 255, .30);
      --veil: rgba(4, 5, 18, .78);
      --shadow: rgba(0, 0, 0, .52);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--body);
      line-height: 1.75;
      overflow-x: hidden;
    }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 4px; }
    .backdrop {
      position: fixed;
      inset: -4vmax;
      z-index: -2;
      background: linear-gradient(var(--veil), var(--veil)), var(--cover-image), var(--paper);
      background-size: cover;
      background-position: center;
      filter: saturate(.82);
      transform: scale(1.06);
      animation: backdrop-breathe 28s ease-in-out infinite alternate;
    }
    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 72% 18%, color-mix(in srgb, var(--accent) 25%, transparent), transparent 34%),
        linear-gradient(180deg, transparent 45%, var(--paper) 96%);
    }
    .skip-link {
      position: fixed;
      left: 1rem;
      top: -5rem;
      z-index: 20;
      padding: .6rem 1rem;
      color: var(--paper);
      background: var(--ink);
      border-radius: 999px;
    }
    .skip-link:focus { top: 1rem; }
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: max(1rem, env(safe-area-inset-top)) clamp(1rem, 4vw, 3rem) 1rem;
      pointer-events: none;
    }
    .wordmark, .music-button {
      pointer-events: auto;
      border: 1px solid var(--line);
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 76%, transparent);
      box-shadow: 0 10px 32px var(--shadow);
      backdrop-filter: blur(16px);
    }
    .wordmark {
      padding: .42rem .8rem;
      border-radius: 999px;
      font: .68rem/1.2 var(--utility);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .music-button {
      display: none;
      align-items: center;
      gap: .55rem;
      padding: .55rem .85rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .music-button[data-ready="true"] { display: inline-flex; }
    .music-dot {
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .music-button[data-playing="true"] .music-dot { animation: pulse 1.8s infinite; }
    .cover {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 7rem 1.25rem 4rem;
      text-align: center;
    }
    .cover-inner { width: min(880px, 100%); position: relative; }
    .orbit {
      width: min(54vw, 380px);
      aspect-ratio: 1;
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%) rotate(-9deg);
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: inset 0 0 70px color-mix(in srgb, var(--accent) 8%, transparent);
      pointer-events: none;
    }
    .orbit::before, .orbit::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px dashed var(--line);
      border-radius: 50%;
      transform: rotate(37deg);
    }
    .orbit::after { inset: -13%; transform: rotate(71deg); opacity: .55; }
    .eyebrow {
      margin: 0 0 1.4rem;
      color: var(--accent-2);
      font: .72rem/1.4 var(--utility);
      letter-spacing: .25em;
      text-transform: uppercase;
    }
    h1, h2 { font-family: var(--display); font-weight: 500; text-wrap: balance; }
    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(3.4rem, 11vw, 8.6rem);
      line-height: .98;
      letter-spacing: -.045em;
      text-shadow: 0 16px 42px var(--shadow);
    }
    .cover-subtitle {
      position: relative;
      max-width: 38rem;
      margin: 2rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      letter-spacing: .08em;
    }
    .enter-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: .8rem;
      margin-top: 3.2rem;
      padding: .85rem 1.25rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: color-mix(in srgb, var(--paper-soft) 74%, transparent);
      text-decoration: none;
      box-shadow: 0 12px 38px var(--shadow);
    }
    .enter-button span { color: var(--accent-2); }
    .preface {
      width: min(700px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: clamp(5rem, 12vw, 10rem) 0;
      font-family: var(--display);
      font-size: clamp(1.25rem, 3.2vw, 2.05rem);
      line-height: 2;
      text-align: center;
      white-space: pre-line;
    }
    .chapters { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; }
    .chapter {
      position: relative;
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(230px, .72fr) minmax(0, 1.28fr);
      gap: clamp(2rem, 7vw, 7rem);
      align-items: center;
      padding: clamp(6rem, 10vw, 10rem) 0;
      border-top: 1px solid var(--line);
    }
    .chapter::before {
      content: "";
      position: absolute;
      left: calc(36% - clamp(1rem, 3.5vw, 3.5rem));
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(transparent, var(--accent), transparent);
      opacity: .5;
    }
    .chapter-copy { position: sticky; top: 7rem; align-self: start; }
    .chapter-number {
      display: block;
      color: var(--accent-2);
      font: .72rem/1.4 var(--utility);
      letter-spacing: .22em;
    }
    .chapter h2 { margin: 1.1rem 0 1.5rem; font-size: clamp(2.1rem, 5vw, 4.6rem); line-height: 1.08; }
    .chapter-kicker { margin: 0 0 .7rem; color: var(--accent); letter-spacing: .12em; }
    .chapter-text { margin: 0; color: var(--muted); white-space: pre-line; font-size: clamp(1rem, 1.5vw, 1.16rem); }
    .media-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .media-card {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--paper-soft);
      box-shadow: 0 18px 55px var(--shadow);
      transform: translateY(22px);
      opacity: 0;
      transition: opacity .7s ease, transform .7s ease;
    }
    .media-card.is-visible { transform: translateY(0); opacity: 1; }
    .media-card:nth-child(3n + 1) { grid-column: span 2; }
    .media-frame { aspect-ratio: 4 / 3; overflow: hidden; background: #05060b; }
    .media-card:nth-child(3n + 1) .media-frame { aspect-ratio: 16 / 9; }
    .media-frame img, .media-frame video { width: 100%; height: 100%; display: block; object-fit: cover; }
    .media-frame video { background: #05060b; }
    .media-frame img[data-motion="slow-zoom"] { animation: slow-zoom 16s ease-in-out infinite alternate; }
    .media-frame img[data-motion="drift-left"] { width: 112%; animation: drift-left 18s ease-in-out infinite alternate; }
    .media-frame img[data-motion="drift-right"] { width: 112%; transform: translateX(-10%); animation: drift-right 18s ease-in-out infinite alternate; }
    .media-frame img[data-motion="breathe"] { animation: breathe 9s ease-in-out infinite; }
    figcaption { min-height: 2.7rem; padding: .7rem .9rem .8rem; color: var(--muted); font-size: .78rem; letter-spacing: .04em; }
    .dedication {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 7rem 1.25rem;
      text-align: center;
    }
    .dedication-inner {
      width: min(680px, 100%);
      padding: clamp(2rem, 7vw, 5rem);
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper-soft) 68%, transparent);
      box-shadow: 0 28px 80px var(--shadow);
      backdrop-filter: blur(14px);
    }
    .dedication-mark { display: block; margin-bottom: 1.5rem; color: var(--accent); font: 2rem/1 var(--display); }
    .dedication-text { margin: 0; font-family: var(--display); font-size: clamp(1.15rem, 3vw, 1.75rem); line-height: 2; white-space: pre-line; }
    .music-credit { margin: 1.8rem 0 0; color: var(--muted); font-size: .72rem; line-height: 1.6; }
    .music-credit a { color: inherit; }
    .footer { padding: 1.5rem; text-align: center; color: var(--muted); font: .66rem/1.5 var(--utility); letter-spacing: .12em; }
    .empty-media { padding: 3rem 1rem; border: 1px dashed var(--line); color: var(--muted); text-align: center; }
    @keyframes backdrop-breathe { to { transform: scale(1.12) translate3d(-1%, 1%, 0); } }
    @keyframes pulse { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    @keyframes slow-zoom { to { transform: scale(1.1); } }
    @keyframes drift-left { from { transform: translateX(0) scale(1.04); } to { transform: translateX(-10%) scale(1.04); } }
    @keyframes drift-right { from { transform: translateX(-10%) scale(1.04); } to { transform: translateX(0) scale(1.04); } }
    @keyframes breathe { 50% { transform: scale(1.045); filter: saturate(1.08); } }
    @media (max-width: 760px) {
      .chapter { grid-template-columns: 1fr; gap: 2.2rem; min-height: auto; }
      .chapter::before { display: none; }
      .chapter-copy { position: static; }
      .media-grid { grid-template-columns: 1fr; }
      .media-card:nth-child(3n + 1) { grid-column: auto; }
      .media-card .media-frame, .media-card:nth-child(3n + 1) .media-frame { aspect-ratio: 4 / 5; }
      .orbit { width: 72vw; }
      .music-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
      .media-card { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#chapters">跳到正文</a>
  <div class="backdrop" aria-hidden="true"></div>
  <header class="topbar">
    <div class="wordmark">Her Gallery · Offline Edition</div>
    <button class="music-button" id="musicButton" type="button" data-ready="false" data-playing="false" aria-label="播放背景音乐">
      <span class="music-dot" aria-hidden="true"></span><span class="music-label">播放音乐</span>
    </button>
  </header>
  <main>
    <section class="cover" aria-labelledby="galleryTitle">
      <div class="cover-inner">
        <div class="orbit" aria-hidden="true"></div>
        <p class="eyebrow" id="galleryEyebrow"></p>
        <h1 id="galleryTitle"></h1>
        <p class="cover-subtitle" id="gallerySubtitle"></p>
        <a class="enter-button" href="#preface">打开这份礼物 <span aria-hidden="true">↓</span></a>
      </div>
    </section>
    <section class="preface" id="preface" aria-label="序言"></section>
    <div class="chapters" id="chapters"></div>
    <section class="dedication" aria-label="献词">
      <div class="dedication-inner">
        <span class="dedication-mark" aria-hidden="true">✦</span>
        <p class="dedication-text" id="dedicationText"></p>
        <p class="music-credit" id="musicCredit" hidden></p>
      </div>
    </section>
  </main>
  <footer class="footer">Made with memories · Kept in one offline file</footer>
  <audio id="music" loop preload="metadata"></audio>
  <script id="gallery-data" type="application/json">__GALLERY_DATA__</script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById('gallery-data').textContent);
      document.documentElement.dataset.theme = data.theme || 'moonlit-letter';
      document.title = `${data.title} · ${data.displayName}`;
      document.getElementById('galleryEyebrow').textContent = `A personal exhibition for ${data.displayName}`;
      document.getElementById('galleryTitle').textContent = data.title;
      document.getElementById('gallerySubtitle').textContent = data.subtitle || '';
      document.getElementById('preface').textContent = data.preface;
      document.getElementById('dedicationText').textContent = data.dedication;
      const musicCredit = document.getElementById('musicCredit');
      let hasCredits = false;
      const appendCredit = (label, credit) => {
        if (!credit?.attribution) return;
        if (hasCredits) musicCredit.append(document.createElement('br'));
        musicCredit.append(document.createTextNode(`${label}：${credit.attribution}`));
        if (credit.sourceUrl) {
          const sourceLink = document.createElement('a');
          sourceLink.href = credit.sourceUrl;
          sourceLink.target = '_blank';
          sourceLink.rel = 'noopener noreferrer';
          sourceLink.textContent = '查看来源';
          musicCredit.append(document.createTextNode(' · '), sourceLink);
        }
        hasCredits = true;
      };
      appendCredit('音乐', data.music);
      appendCredit('背景', data.backgroundMeta);
      musicCredit.hidden = !hasCredits;
      if (data.background) {
        document.documentElement.style.setProperty('--cover-image', `url("${data.background}")`);
      } else {
        document.documentElement.style.setProperty('--cover-image', 'none');
      }

      const imageTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/avif'];
      const isImage = src => imageTypes.some(type => src.startsWith(`data:${type}`)) || /\.(jpe?g|png|gif|webp|avif)(?:$|[?#])/i.test(src);
      const chapters = document.getElementById('chapters');

      data.chapters.forEach((chapter, chapterIndex) => {
        const section = document.createElement('section');
        section.className = 'chapter';
        section.id = `chapter-${chapterIndex + 1}`;
        section.innerHTML = `
          <div class="chapter-copy">
            <span class="chapter-number">CHAPTER ${String(chapterIndex + 1).padStart(2, '0')}</span>
            ${chapter.kicker ? `<p class="chapter-kicker"></p>` : ''}
            <h2></h2>
            <p class="chapter-text"></p>
          </div>
          <div class="media-grid"></div>`;
        section.querySelector('h2').textContent = chapter.title;
        section.querySelector('.chapter-text').textContent = chapter.text || '';
        if (chapter.kicker) section.querySelector('.chapter-kicker').textContent = chapter.kicker;
        const grid = section.querySelector('.media-grid');
        const media = chapter.media || [];
        if (!media.length) {
          grid.innerHTML = '<div class="empty-media">这一章把位置留给仍在发生的记忆。</div>';
        }
        media.forEach(item => {
          const figure = document.createElement('figure');
          figure.className = 'media-card';
          const frame = document.createElement('div');
          frame.className = 'media-frame';
          if (isImage(item.src)) {
            const image = document.createElement('img');
            image.src = item.src;
            image.alt = item.alt ?? '';
            image.loading = 'lazy';
            image.decoding = 'async';
            image.dataset.motion = item.motion || 'none';
            frame.appendChild(image);
          } else {
            const video = document.createElement('video');
            video.src = item.src;
            video.controls = true;
            video.playsInline = true;
            video.preload = 'metadata';
            video.setAttribute('aria-label', item.alt || item.caption || `第 ${chapterIndex + 1} 章影像`);
            frame.appendChild(video);
          }
          const caption = document.createElement('figcaption');
          caption.textContent = item.caption || '';
          figure.append(frame, caption);
          grid.appendChild(figure);
        });
        chapters.appendChild(section);
      });

      const cards = document.querySelectorAll('.media-card');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: .12 });
        cards.forEach(card => observer.observe(card));
      } else {
        cards.forEach(card => card.classList.add('is-visible'));
      }

      const music = document.getElementById('music');
      const musicButton = document.getElementById('musicButton');
      if (data.music?.src) {
        music.src = data.music.src;
        musicButton.dataset.ready = 'true';
        musicButton.querySelector('.music-label').textContent = data.music.label || '播放音乐';
        musicButton.addEventListener('click', async () => {
          if (music.paused) {
            try {
              await music.play();
              musicButton.dataset.playing = 'true';
              musicButton.setAttribute('aria-label', '暂停背景音乐');
              musicButton.querySelector('.music-label').textContent = '暂停音乐';
            } catch (error) {
              musicButton.querySelector('.music-label').textContent = '无法播放';
            }
          } else {
            music.pause();
            musicButton.dataset.playing = 'false';
            musicButton.setAttribute('aria-label', '播放背景音乐');
            musicButton.querySelector('.music-label').textContent = data.music.label || '播放音乐';
          }
        });
        document.querySelectorAll('video').forEach(video => {
          video.addEventListener('play', () => { if (!music.paused) music.volume = .18; });
          video.addEventListener('pause', () => { music.volume = 1; });
          video.addEventListener('ended', () => { music.volume = 1; });
        });
      }
    })();
  </script>
</body>
</html>
